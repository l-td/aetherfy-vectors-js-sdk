name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # --no-audit: ci.yml's security job audited this commit already; a
      # release should not wait five minutes on an unread registry POST.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run full deployment check
        run: npm run deploy-check

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
