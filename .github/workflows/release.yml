name: Release

on:
  release:
    types: [published]
  # PRE-FLIGHT: the same job, end to end, for a tag, without publishing. So the
  # first real publish is not the first time the tag checkout, the npm token
  # and the runner meet. It checks out the tag, packs once, tests that file,
  # proves the token (npm whoami) and publishes with --dry-run.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to pre-flight (for example v2.0.0). Nothing is published.'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # true on a pre-flight, false on a real release. ONE job, one set of
      # steps: the only difference is the --dry-run on the publish.
      PREFLIGHT: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # A release checks out its own tag (github.ref). A pre-flight checks
          # out the tag it was given, as a tag: refs/tags/, so a branch that
          # happens to share the name cannot be picked up instead.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Run full deployment check
        run: npm run deploy-check

      # PACK ONCE, TEST THAT FILE, PUBLISH THAT FILE. `npm publish` from the
      # folder runs prepublishOnly, which cleans and rebuilds, so the bytes it
      # uploaded were a second build that nothing had tested. Publishing a
      # tarball runs no lifecycle script and no build: what the package test
      # installed is exactly what npm receives. The test and the publish log
      # the same sha1 (npm reports it as `shasum`).
      - name: Pack the release tarball
        id: pack
        run: |
          mkdir -p release
          file=$(npm pack --json --pack-destination release | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename)")
          # "./" IS LOAD-BEARING: npm reads a bare "release/<file>.tgz" as a
          # GitHub shorthand (user/repo) and tries to git-clone it.
          echo "tarball=./release/$file" >> "$GITHUB_OUTPUT"
          sha1sum "./release/$file"

      - name: Test the tarball that will be published
        run: npm run test:package
        env:
          AETHERFY_PACKAGE_TARBALL: ${{ steps.pack.outputs.tarball }}

      # Proves NPM_TOKEN is set and valid before anything is published. On a
      # real release this fails the job before the publish instead of during it.
      - name: Check the npm token
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish that tarball (dry run on a pre-flight)
        run: |
          if [ "$PREFLIGHT" = "true" ]; then
            npm publish "$TARBALL" --dry-run
          else
            npm publish "$TARBALL"
          fi
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
