name: CI

# CI RUNS BY DEFAULT. An allow-list of build inputs ("paths:") silently stops
# covering the next input someone adds — it had already missed
# jest.package.config.js and scripts/**. So this lists what provably cannot
# change the build or the tests instead; anything else runs CI. README.md is
# NOT here: tests/unit/readme-*.test.ts read it. examples/** is NOT here: it
# ships in the tarball ("files").
on:
  push:
    branches: [main, develop]
    paths-ignore: &not-build-inputs
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'docs/**'
      - '.github/dependabot.yml'
      - '.github/docs-routes.txt'
      - '.github/workflows/docs-links.yml'
      - '.github/workflows/pin-guard.yml'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main, develop]
    paths-ignore: *not-build-inputs
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # --no-audit: the `security` job below is THE audit, once per commit;
      # this matrix would otherwise run npm's built-in one nine more times, each
      # an unread, un-retried registry POST with a five-minute default timeout
      # (it held sibling repos' installs for 4-6 minutes on 2026-09-04).
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == '24.x' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          version: v11.3.1
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build package
        run: npm run build:prod

      # No separate artifact list here: build:prod fails on any file
      # package.json promises that the build did not produce (scripts/build.js
      # reads the list from package.json), and the next step installs the
      # packed tarball.

      # AFTER the build, by construction: it packs and installs what the build
      # just wrote. Run before it, it would test whatever dist/ was already
      # there. It is the only check that sees the package a customer gets —
      # a chunk left out of "files", an exports path to nothing, a class that
      # exists twice across the CommonJS and ESM entry points.
      - name: Test the packed tarball
        run: npm run test:package

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      # --no-audit here because the next step IS the audit.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run security audit
        run: npm audit --audit-level high

      - name: Check for outdated dependencies
        run: npm outdated --long || true
